<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beam">
<title>Beam · phone prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Tokens from apps/web/src/tokens.css. Style-lab switches below override them. */
:root{
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-display:"Space Grotesk","IBM Plex Sans",sans-serif;
  --track-label:.22em; --track-status:.18em;
  --r-1:2px; --r-2:4px; --r-3:6px;
  --bg:#EFEFEB; --surface:#FBFBF9; --surface-2:#F3F3F0; --surface-3:#E6E6E1;
  --ink:#141414; --ink-2:#3B3B39; --ink-3:#696965; --line:#DEDEDA; --line-2:#C4C4BE;
  --shadow:#D9D9D3;
  --live:#1976A3; --warn:#8F6200; --bad:#B03A30; --ok:var(--ink-2);
  --add:#3F7A2E; --del:#B03A30;
  --fs:15px; --row:54px; --padx:20px; --gap:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08090B; --surface:#0B0C0E; --surface-2:#111317; --surface-3:#1B1E24;
    --ink:#E9EBEF; --ink-2:#B4B8BF; --ink-3:#858A93; --line:#24272D; --line-2:#3A3E46;
    --shadow:#000; --live:#55B6E0; --warn:#E8B23E; --bad:#D9695F; --add:#7FB069; --del:#D9695F;
  }
}
:root[data-theme="dark"]{
  --bg:#08090B; --surface:#0B0C0E; --surface-2:#111317; --surface-3:#1B1E24;
  --ink:#E9EBEF; --ink-2:#B4B8BF; --ink-3:#858A93; --line:#24272D; --line-2:#3A3E46;
  --shadow:#000; --live:#55B6E0; --warn:#E8B23E; --bad:#D9695F; --add:#7FB069; --del:#D9695F;
}
:root[data-font="system"]{--font-sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--font-display:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
:root[data-font="grotesk"]{--font-sans:"Space Grotesk",system-ui,sans-serif}
:root[data-size="s"]{--fs:14px}:root[data-size="l"]{--fs:16.5px}
:root[data-density="compact"]{--row:46px;--padx:16px;--gap:10px}
:root[data-density="airy"]{--row:62px;--padx:22px;--gap:18px}
:root[data-corners="soft"]{--r-1:6px;--r-2:10px;--r-3:16px}
:root[data-live="ink"]{--live:var(--ink)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:var(--ink)}
button:focus-visible{outline:2px solid var(--live);outline-offset:-2px}

/* stage: a phone frame on a desk, the full screen on a phone */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:32px}
.device{width:390px;height:844px;flex:none;position:relative;background:var(--surface);border:1px solid var(--line-2);box-shadow:10px 10px 0 var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.fakebar{height:48px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-family:var(--font-mono);font-size:13px;font-weight:500}
.fakebar .sig{display:inline-flex;gap:3px;align-items:flex-end;height:11px}.fakebar .sig i{display:block;width:3px;background:var(--ink)}.fakebar .sig i:nth-child(1){height:4px}.fakebar .sig i:nth-child(2){height:6px}.fakebar .sig i:nth-child(3){height:8px}.fakebar .sig i:nth-child(4){height:11px}
.side{width:320px;max-height:844px;overflow:auto;flex:none}
.side h1{font-family:var(--font-display);font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
.side p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
@media (max-width:760px){
  .stage{padding:0;display:block;height:100%}
  .device{width:100%;height:100%;height:100dvh;border:0;box-shadow:none;padding-top:env(safe-area-inset-top)}
  .fakebar,.side{display:none}
}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* atoms */
.sq{width:8px;height:8px;background:var(--line-2);flex:none;display:inline-block}
.sq.work{background:var(--live);animation:pulse 1.6s infinite}.sq.ok{background:var(--ok)}.sq.warn{background:var(--warn)}.sq.bad{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.av{width:24px;height:24px;display:inline-grid;place-items:center;font-size:.62rem;font-weight:600;color:var(--surface);background:var(--ink);flex:none;font-family:var(--font-mono);border-radius:var(--r-1);letter-spacing:-.02em}
.av.b{background:var(--ink-2)}.av.c{background:var(--ink-3)}
.av.ag{border-radius:0;background:var(--ink);font-size:.8rem}
:root[data-av="round"] .av:not(.ag){border-radius:50%}
.av.xs{width:17px;height:17px;font-size:.45rem}
.av.lg{width:48px;height:48px;font-size:1rem}
.pres{display:inline-flex}.pres .av{margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}.pres .av:first-child{margin-left:0}
.k{font-family:var(--font-mono);font-size:.73rem;color:var(--ink-3)}
.chip{font-family:var(--font-mono);font-size:.73rem;padding:3px 8px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-1)}
.chip .sq{width:6px;height:6px}
.sec{font-family:var(--font-mono);font-size:.7rem;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);padding:20px var(--padx) 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec button{color:var(--ink-2);letter-spacing:.04em}
.live{color:var(--live)}.warn{color:var(--warn)}.bad{color:var(--bad)}

/* bars */
.top{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 var(--padx);border-bottom:1px solid var(--line)}
.top .brand{font-family:var(--font-display);font-weight:700;letter-spacing:.08em;font-size:1rem;text-transform:uppercase;flex:1;display:flex;align-items:center;gap:9px}
.top .brand i{display:block;width:12px;height:12px;background:var(--ink)}
.top .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl.big{font-size:1.2rem;font-weight:600;font-family:var(--font-display)}
.ttl.name{font-family:var(--font-mono);font-size:.87rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
:root[data-titles="sentence"] .ttl.name{font-family:var(--font-sans);text-transform:none;letter-spacing:0;font-size:1.02rem}
.ttl .sub{display:block;font-family:var(--font-mono);font-size:.67rem;color:var(--ink-3);text-transform:none;letter-spacing:0;font-weight:400}
.icon{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;position:relative}
.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.aa{font-family:var(--font-display);font-weight:600;font-size:.95rem}
.back{margin-left:-14px;color:var(--ink)}
.back svg{width:23px;height:23px;stroke-width:1.8}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tabbar{flex:none;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-2);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--font-mono);font-size:.63rem;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);position:relative}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ink)}
.tabbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;left:calc(50% + 6px);top:7px;min-width:16px;height:16px;padding:0 4px;background:var(--warn);color:var(--surface);font-size:.6rem;letter-spacing:0;display:grid;place-items:center;border-radius:var(--r-1)}
:root[data-tabs="icons"] .tabbar .lbl{display:none}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:8px var(--padx);min-height:var(--row);width:100%;color:var(--ink);border-bottom:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row .body{flex:1;min-width:0;display:grid;gap:2px}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row .t.untitled{font-style:italic;color:var(--ink-3);font-weight:400}
.row .t svg{width:12px;height:12px;fill:none;stroke:var(--ink-3);stroke-width:1.8;flex:none}
.row .s{font-family:var(--font-mono);font-size:.73rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{flex:none;display:grid;justify-items:end;gap:5px}
.row .tm{font-family:var(--font-mono);font-size:.73rem;color:var(--ink-3)}
.row.muted .t{color:var(--ink-3);font-weight:400}
.row.more{min-height:42px;color:var(--ink-3);font-family:var(--font-mono);font-size:.8rem;padding-left:calc(var(--padx) + 20px)}
.row.plain .t{font-weight:400}
.row .chev{color:var(--ink-3);font-family:var(--font-mono)}
/* workspace groups: a header band, then its chats indented under the mark */
.wsg{border-bottom:1px solid var(--line)}
.wshead{display:flex;align-items:center;gap:2px;padding:0 4px 0 var(--padx);min-height:62px;background:var(--surface-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line)}
.wsg:first-child .wshead{border-top:0}
.wshead .name{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 0}
.wtile{width:28px;height:28px;background:var(--ink);color:var(--surface);display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.78rem;flex:none;border-radius:var(--r-1);letter-spacing:.02em}
.wshead .nm{display:grid;min-width:0;gap:1px}
.wshead .nm b{font-family:var(--font-display);font-weight:600;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.wshead .nm small{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wshead .pres{margin-right:4px}
.wshead .fold svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;transition:transform .18s}
.wsg.closed .fold svg{transform:rotate(-90deg)}
.wsg .list .row{padding-left:calc(var(--padx) + 10px)}
.wsg .list .row.more{padding-left:calc(var(--padx) + 30px)}
.wsg .list .row:last-child{border-bottom:0}
/* tile: no band, the chats hang off a rule under the mark */
:root[data-wshead="tile"] .wsg{border-bottom:0;padding-bottom:18px}
:root[data-wshead="tile"] .wshead{background:var(--surface);border:0;min-height:66px;padding-top:6px}
:root[data-wshead="tile"] .wtile{width:34px;height:34px;font-size:.9rem}
:root[data-wshead="tile"] .wsg .list{margin-left:calc(var(--padx) + 16.5px);border-left:1px solid var(--line-2)}
:root[data-wshead="tile"] .wsg .list .row{padding-left:18px;border-bottom:0}
:root[data-wshead="tile"] .wsg .list .row.more{padding-left:38px}
/* label: the desktop sidebar's quiet caps label with a rule */
:root[data-wshead="label"] .wshead{background:var(--surface);border-top:0;min-height:46px;padding-top:14px}
:root[data-wshead="label"] .wtile,:root[data-wshead="label"] .wshead .nm small{display:none}
:root[data-wshead="label"] .wshead .nm b{font-family:var(--font-mono);font-size:.72rem;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-2);font-weight:500}
:root[data-wshead="label"] .wsg .list .row{padding-left:var(--padx)}
:root[data-wshead="label"] .wsg .list .row.more{padding-left:calc(var(--padx) + 20px)}
.recents{display:flex;gap:10px;overflow-x:auto;padding:14px var(--padx) 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.recents::-webkit-scrollbar{display:none}
.rcard{flex:none;width:168px;border:1px solid var(--line-2);border-radius:var(--r-2);padding:11px 12px;display:grid;gap:6px;background:var(--surface)}
.rcard .t{font-weight:500;font-size:.93rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.rcard .s{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.68rem;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.empty{color:var(--ink-3);font-size:.93rem;padding:28px var(--padx);display:grid;gap:6px}
.empty b{color:var(--ink-2);font-weight:500}

/* chat */
.gitbtn{display:flex;align-items:center;gap:4px;height:44px;padding:0 6px;flex:none;color:var(--ink-2)}
.gitbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.gitbtn .n{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-2)}
.cluster{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 6px;flex:none;color:var(--ink-2)}
.cluster svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6}
.cluster .pres .av{width:26px;height:26px;font-size:.58rem}
.crew{display:flex;align-items:center;position:relative;padding-right:4px}
.crew .av{width:24px;height:24px;font-size:.72rem;margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.crew .av:first-child{margin-left:0}
.crew .sq{position:absolute;right:0;top:-3px;width:7px;height:7px;box-shadow:0 0 0 2px var(--surface)}
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--surface);padding:12px 14px;border-radius:var(--r-2)}
.node .body{flex:1;min-width:0;display:grid;gap:3px}
.node .t{font-family:var(--font-mono);font-weight:600;font-size:.87rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .s{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.node .s svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;flex:none}
.node .s.note{white-space:normal}
.node .add{color:var(--add)}.node .del{color:var(--del)}
.node.repo{margin:0 var(--padx);width:calc(100% - var(--padx) * 2)}
.mic{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line-2);flex:none;color:var(--ink-2);border-radius:var(--r-1);background:var(--surface-2)}
.mic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.mic.gh svg{fill:currentColor;stroke:none}
.wire{margin:0 var(--padx) 6px calc(var(--padx) + 30px)}
.tap{position:relative;padding:14px 0 0 26px}
.tap::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line-2)}
.tap:last-child::before{bottom:auto;height:43px}
.tap::after{content:"";position:absolute;left:0;top:43px;width:26px;border-top:1px solid var(--line-2)}
.mnode{padding:12px}
.agents{margin-left:28px}
.anode{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0 10px 22px;min-height:58px}
.anode::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px dashed var(--line-2)}
.anode:last-child::before{bottom:50%}
.anode::after{content:"";position:absolute;left:0;top:50%;width:14px;border-top:1px dashed var(--line-2)}
.anode .body{flex:1;min-width:0;display:grid;gap:2px}
.anode .t{font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.anode .own{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:.68rem;color:var(--ink-3);font-weight:400}
.anode .s{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-3)}
.anode .state{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-2);text-align:right;flex:none;white-space:nowrap;align-self:flex-start;padding-top:3px}
.anode .own{margin-top:1px}
.bring{display:block;margin:16px var(--padx) 28px;width:calc(100% - var(--padx) * 2);min-height:48px;border:1px solid var(--line-2);font-family:var(--font-mono);font-size:.87rem;color:var(--ink);text-align:center;border-radius:var(--r-1)}
.opt.agent .state{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-2);flex:none;white-space:nowrap;align-self:flex-start;padding-top:4px}
.row.chg .t{font-family:var(--font-mono);font-size:.85rem;font-weight:500}
.sec span{color:var(--ink-2)}
.presbtn{display:flex;align-items:center;height:44px;padding:0 10px 0 6px;flex:none}
.presbtn .av{width:26px;height:26px;font-size:.58rem}
.presbtn .pres .av{box-shadow:0 0 0 2px var(--surface)}
.chat-top .ttl .lk{display:inline-flex;margin-right:6px;vertical-align:-1px}.chat-top .ttl .lk svg{width:12px;height:12px;fill:none;stroke:var(--ink-3);stroke-width:1.8}
.chat-top .ttl .sub{font-size:.7rem;margin-top:1px}
.chatsub{display:flex;gap:6px;align-items:center;padding:8px var(--padx);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.chatsub::-webkit-scrollbar{display:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:var(--gap);overscroll-behavior:contain}
.daysep{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:.68rem;letter-spacing:var(--track-status);text-transform:uppercase;color:var(--ink-3)}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.msg .av{width:28px;height:28px;font-size:.66rem}
.msg .hd{display:flex;gap:8px;align-items:baseline}
.msg .nm{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;font-size:.73rem;font-weight:600}
:root[data-titles="sentence"] .msg .nm{font-family:var(--font-sans);text-transform:none;letter-spacing:0;font-size:.87rem}
.msg .tm{font-size:.7rem;color:var(--ink-3);font-family:var(--font-mono)}
.msg .tx{white-space:pre-wrap;margin-top:2px;overflow-wrap:anywhere}
.msg.held .tx{background:var(--surface-2)}
.mention{font-weight:600;padding:0 3px;background:var(--surface-3);border-radius:var(--r-1)}
:root[data-chat="bubbles"] .msg .tx{background:var(--surface-2);padding:8px 11px;border-radius:var(--r-3);display:inline-block;max-width:100%}
:root[data-chat="bubbles"] .msg.mine{grid-template-columns:minmax(0,1fr);justify-items:end}
:root[data-chat="bubbles"] .msg.mine>.av{display:none}
:root[data-chat="bubbles"] .msg.mine .hd{justify-content:flex-end}
:root[data-chat="bubbles"] .msg.mine .tx{background:var(--ink);color:var(--surface)}
:root[data-chat="bubbles"] .msg.mine .tx .mention{background:transparent;color:inherit;text-decoration:underline}
:root[data-chat="bubbles"] .msg.mine .reacts{justify-content:flex-end}
:root[data-chat="bubbles"] .msg.cont{margin-top:calc(var(--gap) * -.6)}
.msg.cont>.av{visibility:hidden}.msg.cont .hd{display:none}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);padding:2px 9px;font-size:.87rem;background:var(--surface);color:var(--ink-2);font-family:var(--font-mono);min-height:30px;border-radius:var(--r-1)}
.rc span{font-size:.73rem}

/* chat row status: what matters when you are away */
function status(c) {
  const r = lastRun(c);
  const h = r ? agentName(r) : "";
  if (r?.state === "waiting") return { sq: "warn", html: `<span class="warn">${h} ${r.ask.kind === "question" ? "has a question" : "waiting for approval"}</span>` };
  if (r?.state === "working") return { sq: "work", html: `<span class="live">${h} working · <span data-el="${r.id}">${fmt(r.elapsed)}</span></span>` };
  const last = c.msgs[c.msgs.length - 1];
  if (!last) return { sq: "", html: "no messages yet" };
  if (last.type === "a") {
    const lr = last.run;
    if (lr.state === "failed" || lr.state === "stopped") return { sq: "bad", html: `<span class="bad">${lr.state === "stopped" ? "stopped" : "run failed"}</span>` };
    return { sq: "", html: `${agentName(lr).toLowerCase()}: ${lr.landing ? `pushed ${lr.landing.files} file${lr.landing.files === 1 ? "" : "s"}` : "replied"}` };
  }
  return { sq: "", html: `${last.who === ME ? "you" : PEOPLE[last.who].login}: ${esc(last.text)}` };
}

    const here = runs.filter((r) => r.machine === m.id), dirty = files.filter((f) => f.run.machine === m.id && !f.pushed).length;
    const live = here.find(isLive);
    const note = live ? (live.state === "waiting" ? `<span class="warn">${agentName(live)} is waiting on you</span>` : `<span class="live">${agentName(live)} is working here</span>`) : dirty ? `${dirty} unpushed change${dirty === 1 ? "" : "s"}` : "worktree clean";
    return `<div class="tap"><button class="node mnode" data-act="sheet" data-kind="machine" data-id="${m.id}"><span class="mic">${I[m.kind]}</span><span class="body"><span class="t">${m.name}</span><span class="s">${m.owner === ME ? "your" : `${PEOPLE[m.owner].name}'s`} ${m.os} · ${m.online ? "online" : `offline ${m.seen}`}</span><span class="s note">${note}</span></span><span class="sq ${m.online ? "ok" : ""}"></span></button></div>`;
  }).join("");
  const split = (p) => { const i = p.lastIndexOf("/"); return [p.slice(i + 1), i > 0 ? p.slice(0, i) : ""]; };
  const fileRow = (f) => { const [name, dir] = split(f.path); return `<div class="row chg"><span class="sq ${f.pushed ? "ok" : ""}"></span><span class="body"><span class="t">${esc(name)}</span><span class="s">${dir ? `${esc(dir)} · ` : ""}${agentName(f.run).toLowerCase()}</span></span><span class="tm">${f.pushed ? "pushed" : "in worktree"}</span></div>`; };
  return `<div class="top"><button class="icon back" data-act="back">${I.back}</button><span class="ttl name">${esc(c.title)}<span class="sub">${esc(w.name)}${c.priv ? " · private" : ""}</span></span></div>
  <div class="scroll" data-key="details-${c.id}">
    <div class="sec">Code</div>
    <button class="node repo" data-act="toast" data-msg="Opens ${esc(repo)} on GitHub"><span class="mic gh">${I.gh}</span><span class="body"><span class="t">${esc(repo)}</span><span class="s">${I.branch}${c.branch ? esc(c.branch) : "no branch until an agent is dispatched"}</span>${land ? `<span class="s">${I.pr}PR #${land.pr} open · <span class="add">+${land.add}</span> <span class="del">−${land.del}</span></span>` : ""}</span><span class="chev">↗</span></button>
    ${machines.length ? `<div class="wire">${tree}</div><div class="k" style="padding:10px var(--padx) 0 calc(var(--padx) + 30px)">each machine keeps its own worktree of the branch</div>` : ""}
    ${files.length ? `<div class="sec">Changes <span>${files.length}</span></div>${files.filter((f) => !f.pushed).map(fileRow).join("")}${files.filter((f) => f.pushed).map(fileRow).join("")}` : ""}
    <div class="sec">Chat</div>
    <button class="opt" data-act="rename" data-id="${c.id}"><span class="body"><span class="t">Rename</span></span></button>
    <button class="pref" data-act="mute" data-id="${c.id}"><span>Mute notifications</span><span class="switch${S.muted[c.id] ? "" : " off"}"></span></button>
    <button class="opt" data-act="settle" data-id="${c.id}" style="border-bottom:1px solid var(--line)"><span class="body"><span class="t">${c.settled ? "Reopen" : "Settle"}</span><span class="s">${c.settled ? "back into the list" : "folds under settled; branch and history stay"}</span></span></button>
    <div style="height:28px"></div>
  </div>`;
}
function chatScreen(id) {
  const c = chat(id);
  const w = ws(c.ws);
  const r = lastRun(c);
  const live = isLive(r);
  const hereNow = here(c.id);
  const m = c.machine ? mach(c.machine) : null;
  let prev = null;
  const msgs = c.msgs.map((msg) => {
    const cont = prev && msg.type === "p" && prev.type === "p" && prev.who === msg.who;
    prev = msg;
    return msgHTML(c, msg, cont);
  }).join("");
  const def = c.agent ?? w.agents[0].h;
  const cfg = agentCfg(c, def);
  const typing = S.typing[c.id] ? `${av(S.typing[c.id], "xs")} ${PEOPLE[S.typing[c.id]].name} is typing` : "";
  const draft = S.draft[c.id] ?? "";
  const ownOnline = MACHINES.filter((x) => x.owner === ME && x.online);
  const others = hereNow.filter((p) => p !== ME);
  const crew = chatAgents(c);
  const runs = c.msgs.filter((x) => x.type === "a").map((x) => x.run);
  const pr = [...runs].reverse().find((x) => x.landing)?.landing.pr;
  const unpushed = new Set(runs.filter((x) => !x.landing).flatMap((x) => x.steps.filter((y) => y.k === "edit" || y.k === "write").map((y) => y.what))).size;
  const gitTag = unpushed ? `<span class="n">${unpushed}</span>` : pr ? `<span class="n">#${pr}</span>` : "";
  const crewState = crew.some((a) => a.run.state === "waiting") ? "warn" : crew.some((a) => a.run.state === "working") ? "work" : "";
  const state = r?.state === "waiting" ? `<span class="warn">${agentName(r)} is waiting on you</span>` : r?.state === "working" ? `<span class="live">${agentName(r)} is working</span>` : "";
  return `<div class="top chat-top"><button class="icon back" data-act="back">${I.back}</button><button class="ttl name" data-act="details" data-id="${c.id}">${c.priv ? `<span class="lk">${I.lock}</span>` : ""}${esc(c.title)}<span class="sub">${state || esc(w.name)}</span></button><button class="gitbtn" data-act="details" data-id="${c.id}" aria-label="Code and machines${unpushed ? `, ${unpushed} unpushed changes` : pr ? `, PR ${pr} open` : ""}">${I.branch}${gitTag}</button><button class="cluster" data-act="sheet" data-kind="people" data-id="${c.id}" aria-label="People and agents in this chat">${others.length ? pres(others, "") : ""}${crew.length ? `<span class="crew">${crew.slice(0, 3).map((a) => agav(a.h)).join("")}${crewState ? `<span class="sq ${crewState}"></span>` : ""}</span>` : ""}${!others.length && !crew.length ? I.more : ""}</button></div>
    <div class="msgs" data-key="chat-${c.id}" data-chat="${c.id}">
      ${c.msgs.length ? '<div class="daysep">today</div>' : `<div class="empty"><b>Nothing here yet.</b>Say something, or @mention an agent. The chat gets a branch when the first agent is dispatched.</div>`}
      ${msgs}
    </div>
    <div class="typing">${typing}</div>
    <div id="mentions"></div>
    ${ownOnline.length ? "" : '<div class="nomachine">none of your machines is online · messages still post</div>'}
    <div class="composer">
      <textarea id="composer" rows="1" placeholder="Message · @ to mention">${esc(draft)}</textarea>
      <div class="ft"><button class="at" data-act="at" aria-label="Mention">@</button><button class="chip bare" data-act="sheet" data-kind="agent" data-id="${c.ws}" data-h="${def}">${agav(def, "xs")} ${MODES.find((x) => x.v === cfg.mode).label.toLowerCase()}</button><span class="sp"></span>${live ? `<button class="stop" data-act="stop" data-id="${r.id}">Stop</button>` : ""}<button class="send" data-act="send" ${draft.trim() ? "" : "disabled"} aria-label="Send">${I.send}</button></div>
    </div>`;
}
function msgHTML(c, m, cont) {
  if (m.type === "p") {
    const reacts = Object.entries(m.reacts).filter(([, w]) => w.length);
    return `<div class="msg${cont ? " cont" : ""}${m.who === ME ? " mine" : ""}${S.reactFor === m.id ? " held" : ""}" data-mid="${m.id}">${av(m.who)}<div><div class="hd"><span class="nm">${PEOPLE[m.who].name}</span><span class="tm">${m.t}</span></div><div class="tx">${mentionHTML(m.text)}</div>${reacts.length ? `<div class="reacts">${reacts.map(([e, w]) => `<button class="rc${w.includes(ME) ? " mine" : ""}" data-act="react" data-mid="${m.id}" data-e="${e}">${e} <span>${w.length}</span></button>`).join("")}</div>` : ""}</div>${S.reactFor === m.id ? `<div class="rbar">${REACTS.map((e) => `<button data-act="react" data-mid="${m.id}" data-e="${e}">${e}</button>`).join("")}</div>` : ""}</div>`;
  }
  return `<div class="msg" data-mid="${m.id}">${agav(m.agent)}<div><div class="hd"><span class="nm">${agentName(m.run)}</span><span class="tm">${m.t}</span></div>${runHTML(c, m.run)}</div></div>`;
}
function runHTML(c, r) {
  const n = r.steps.length;
  const open = S.open[r.id] ?? r.state === "working";
  const h = agentName(r);
  const head = r.state === "working" ? (n ? `${h} is working · ${n} step${n === 1 ? "" : "s"}` : `${h} is thinking`) : r.state === "waiting" ? `waiting on you · ${n} steps` : `${n} step${n === 1 ? "" : "s"}`;
  const stc = r.state === "working" ? "work" : r.state === "waiting" ? "wait" : r.state === "done" ? "done" : "bad";
  let out = n || isLive(r) ? `<div class="act${open ? "" : " closed"}"><button class="ah" data-act="foldrun" data-id="${r.id}"><span class="tog">${open ? I.dn : I.right}</span><span class="ttl">${head}</span><span class="st ${stc}"><i></i><span ${r.state === "working" ? `data-el="${r.id}"` : ""}>${fmt(r.elapsed)}</span></span></button><div class="steps">${r.steps.map((s) => `<div class="step"><span class="sq ${s.ok === null ? "work" : s.ok ? "ok" : "bad"}"></span><span class="kind">${s.k}</span><span class="what">${esc(s.what)}</span><span class="r">${s.ok === null ? "…" : s.ms}</span></div>`).join("")}</div></div>` : "";
  if (r.ask) out += askHTML(r);
  if (r.state === "working" && !r.reply && r.ask?.resolved) out += `<div class="rstat"><i></i>continuing on ${mach(r.machine).name}</div>`;
  if (r.state === "working" && !n) out += `<div class="rstat"><i></i>preparing worktree on ${mach(r.machine).name}</div>`;
  if (r.reply) out += `<div class="tx" style="margin-top:8px">${mentionHTML(r.reply)}</div>`;
  if (r.landing) out += `<button class="card" data-act="details" data-id="${c.id}"><span class="ai">⎇</span><span><span class="ttl" style="display:block">${esc(r.landing.branch)}</span><span class="mt"><span>${r.landing.repo}</span><span>pushed</span><span class="add">+${r.landing.add}</span><span class="del">−${r.landing.del}</span><span>${r.landing.files} files</span><span class="go">PR #${r.landing.pr} ↗</span></span></span></button>`;
  if (r.error) out += `<div class="rstat bad"><i></i>${esc(r.error)}</div>`;
  return out;
}
function askHTML(r) {
  const a = r.ask;
  if (a.resolved) return `<div class="ask done"><div class="askp"><span class="k">${a.kind === "question" ? "question" : "approval"}</span>${a.kind === "question" ? `<p>${esc(a.prompt)}</p>` : `<pre>${esc(a.prompt)}</pre>`}</div><div class="did">${a.kind === "question" ? `answered “${esc(a.resolved)}”` : a.resolved === "deny" ? "denied" : a.resolved === "always" ? "allowed, always" : "allowed"} by you · from phone</div></div>`;
  if (a.kind === "question") return `<div class="ask"><div class="askp"><span class="k">waiting for an answer</span><p>${esc(a.prompt)}</p></div>${a.options ? `<div class="opts">${a.options.map((o) => `<button data-act="resolve" data-id="${r.id}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}<div class="answer"><input data-answer="${r.id}" placeholder="Or type an answer"><button data-act="answer" data-id="${r.id}">Send</button></div></div>`;
  return `<div class="ask"><div class="askp"><span class="k">waiting for approval</span><pre>${esc(a.prompt)}</pre></div><div class="perm"><button data-act="resolve" data-id="${r.id}" data-v="allow">allow</button><button data-act="resolve" data-id="${r.id}" data-v="always">always</button><button class="deny" data-act="resolve" data-id="${r.id}" data-v="deny">deny</button></div></div>`;
}

function inbox() {
  const needs = (n) => (n.kind === "approval" || n.kind === "question") && findRun(n.run)?.run.ask && !findRun(n.run).run.ask.resolved;
  const groups = { all: () => true, needs, mention: (n) => n.kind === "mention", runs: (n) => n.kind === "completed" || n.kind === "failed" };
  const count = (k) => INBOX.filter(groups[k]).filter((n) => k === "all" ? !n.read : true).length;
  const items = INBOX.filter(groups[S.filter]).sort((a, b) => a.at - b.at);
  const today = items.filter((n) => n.at < 600), earlier = items.filter((n) => n.at >= 600);
  const sq = { approval: "warn", question: "warn", mention: "", completed: "ok", failed: "bad" };
  const row = (n) => {
    const c = chat(n.chat), fr = n.run ? findRun(n.run) : null, open = needs(n);
    let act = "";
    if (open && n.kind === "approval") act = `<pre>${esc(n.body)}</pre><span class="go"><button data-act="resolve" data-id="${n.run}" data-v="allow">allow</button><button data-act="resolve" data-id="${n.run}" data-v="always">always</button><button class="deny" data-act="resolve" data-id="${n.run}" data-v="deny">deny</button></span>`;
    else if (open && n.kind === "question") act = `<span class="go">${(fr.run.ask.options ?? []).map((o) => `<button data-act="resolve" data-id="${n.run}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</span><span class="go"><input data-answer="${n.run}" placeholder="Type an answer"><button data-act="answer" data-id="${n.run}">Send</button></span>`;
    const body = open ? (n.kind === "question" ? n.body : "") : n.kind === "approval" || n.kind === "question" ? (fr?.run.ask?.resolved ? (n.kind === "question" ? `Answered “${fr.run.ask.resolved}”` : `${fr.run.ask.resolved === "deny" ? "Denied" : fr.run.ask.resolved === "always" ? "Allowed, always" : "Allowed"}: ${n.body}`) : n.body) : n.body;
    return `<div class="nrow${n.read ? " read" : ""}" data-act="inboxopen" data-n="${n.id}"><span class="sq ${open ? "warn" : sq[n.kind]}"></span><span class="body"><b>${esc(open || !(n.kind === "approval" || n.kind === "question") ? n.title : "Resolved")}</b>${body ? `<span>${mentionHTML(body)}</span>` : ""}${act}<span class="where">${esc(ws(c.ws).name)} · ${esc(c.title)}</span></span><span class="tm">${ago(n.at)}${n.read ? "" : '<span class="unread"></span>'}</span></div>`;
  };
  return `<div class="top"><span class="ttl big">Inbox</span><button class="k" style="padding:0 10px;height:40px" data-act="readall">Mark all read</button></div>
    <div class="seg">${[["all", "All"], ["needs", "Needs you"], ["mention", "Mentions"], ["runs", "Runs"]].map(([k, l]) => `<button class="${S.filter === k ? "on" : ""}" data-act="filter" data-v="${k}">${l}${k !== "runs" && count(k) ? `<span>${count(k)}</span>` : ""}</button>`).join("")}</div>
    <div class="scroll" data-key="inbox">
      ${today.length ? `<div class="sec">Today</div>${today.map(row).join("")}` : ""}
      ${earlier.length ? `<div class="sec">Earlier</div>${earlier.map(row).join("")}` : ""}
      ${items.length ? "" : `<div class="empty"><b>${S.filter === "needs" ? "Nothing is waiting on you." : "Nothing here."}</b>${S.filter === "needs" ? "When an agent stops to ask, it lands here and as a push." : ""}</div>`}
      <div class="empty" style="font-size:.8rem">Mentions stay here. Runs in chats you follow notify you when they finish, fail, or need someone.</div>
    </div>`;
}

/* ============ sheets ============ */
function sheet() {
  const s = S.sheet; if (!s) return "";
  let body = "";
  if (s.kind === "lab") body = `<div class="sh">Style lab</div><div class="sp">Try variations. Saved on this device.</div>${labHTML()}`;
  if (s.kind === "runner") {
    const c = chat(s.id); const h = s.h ?? c.agent ?? ws(c.ws).agents[0].h;

    body = `<div class="sh">Run ${HARNESS[h].name} on</div><div class="sp">Remembered for this chat. A run stays on its machine until it ends with a push.</div>${MACHINES.filter((m) => m.owner === ME).map(opt).join("")}<div class="sec">Teammates' machines</div>${MACHINES.filter((m) => m.owner !== ME && m.shared).map(opt).join("")}<button class="cancel" data-act="close">Cancel</button>`;
  }
  if (s.kind === "agent") {

      <div class="sec">Model</div>${HARNESS[a.h].models.map((m) => `<button class="opt" data-act="agentset" data-id="${w.id}" data-h="${a.h}" data-k="model" data-v="${m}"><span class="body"><span class="t">${m}</span></span><span class="chk">${a.model === m ? "✓" : ""}</span></button>`).join("")}
      <div class="sec">Effort</div><div class="effpick">${EFFORT.map((e, i) => `<button class="${a.effort === i + 1 ? "on" : ""}" data-act="agentset" data-id="${w.id}" data-h="${a.h}" data-k="effort" data-v="${i + 1}"><span class="eff" data-lv="${i + 1}"><i></i><i></i><i></i><i></i></span>${e}</button>`).join("")}</div>
      <div class="sec">Permissions</div>${MODES.map((m) => `<button class="opt" data-act="agentset" data-id="${w.id}" data-h="${a.h}" data-k="mode" data-v="${m.v}"><span class="body"><span class="t">${m.label}</span><span class="s">${m.hint}</span></span><span class="chk">${a.mode === m.v ? "✓" : ""}</span></button>`).join("")}
      <button class="cancel" data-act="close">Done</button>`;
  }
  if (s.kind === "machine") {
    const m = mach(s.id), mine = m.owner === ME;
    body = `<div class="sh">${m.name}</div><div class="sp">${m.online ? "Online" : `Offline · last seen ${m.seen}`} · ${m.how}</div>
      <div class="sec">Harnesses</div>${m.harn.map((h) => `<div class="opt">${agav(h)}<span class="body"><span class="t">${HARNESS[h].name}</span><span class="s">signed in · sign in or out on the machine</span></span></div>`).join("")}

  const m = ta.value.match(/@(\w*)$/); if (!m) { box.innerHTML = ""; return; }
  const c = chat(route().id), w = ws(c.ws), q = m[1].toLowerCase();
  const agents = w.agents.filter((a) => a.h.startsWith(q)).map((a) => `<button data-act="mention" data-v="${a.h}">${agav(a.h)}${HARNESS[a.h].name}<span class="d">${a.model} · ${EFFORT[a.effort - 1]} · ${a.mode}</span></button>`);
  const people = w.members.filter((p) => p !== ME && PEOPLE[p].login.startsWith(q)).map((p) => `<button data-act="mention" data-v="${PEOPLE[p].login}">${av(p)}${PEOPLE[p].name}<span class="d">${FOCUS[p] ? "online" : "away"}</span></button>`);
  box.innerHTML = agents.length + people.length ? `<div class="mentions">${agents.length ? `<div class="ph">Agents</div>${agents.join("")}` : ""}${people.length ? `<div class="ph">People</div>${people.join("")}` : ""}</div>` : "";
}
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "composer") { S.draft[route().id] = t.value; autosize(t); syncSend(); mentions(); }
  if (t.id === "q") { S.q = t.value; document.getElementById("results").innerHTML = results(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "composer" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  if (e.target.dataset?.answer && e.key === "Enter") { e.preventDefault(); act("answer", { id: e.target.dataset.answer }, e.target, e); }
  if (e.target.id === "paircode" && e.key === "Enter") act("pair", {}, e.target, e);
  if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); }
});
document.addEventListener("scroll", (e) => {
  const el = e.target; if (!(el instanceof HTMLElement) || !el.dataset.key) return;
  S.scroll[el.dataset.key] = el.scrollTop;
  if (el.classList.contains("msgs")) S.stick[el.dataset.key] = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
}, true);
/* long press a message for reactions (right-click on a desk) */
let press;
document.addEventListener("pointerdown", (e) => {
  const m = e.target.closest(".msg[data-mid]"); if (!m || e.target.closest("button,input,textarea")) return;
  const id = m.dataset.mid; if (!CHATS.flatMap((c) => c.msgs).find((x) => x.id === id && x.type === "p")) return;
  press = setTimeout(() => { S.reactFor = id; S.stick[`chat-${route().id}`] = false; navigator.vibrate?.(8); render(); }, 450);
});
["pointerup", "pointercancel", "pointermove"].forEach((t) => document.addEventListener(t, (e) => { if (t === "pointermove" && Math.abs(e.movementY) < 3) return; clearTimeout(press); }));
document.addEventListener("contextmenu", (e) => { const m = e.target.closest(".msg[data-mid]"); if (m) { e.preventDefault(); if (CHATS.flatMap((c) => c.msgs).find((x) => x.id === m.dataset.mid && x.type === "p")) { S.reactFor = m.dataset.mid; render(); } } });

/* clock: live timers tick in place, scripted events re-render */
setInterval(() => {
  S.clock++;
  for (const { run } of allRuns()) if (run.state === "working") { run.elapsed++; document.querySelectorAll(`[data-el="${run.id}"]`).forEach((n) => (n.textContent = fmt(run.elapsed))); }
  const due = timers.filter((t) => t.at <= S.clock);
  if (due.length) { for (const t of due) { timers.splice(timers.indexOf(t), 1); t.fn(); } render(); }
}, 1000);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { applyStyle(); render(); });

applyStyle();
scriptCodex();
render();
</script>
</body>
</html>
