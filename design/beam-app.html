<title>Beam Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9EBE7; --surface:#FFFFFF; --surface-2:#F1F2EF; --surface-3:#E2E5E0;
  --ink:#1B1F22; --ink-2:#5B6369; --ink-3:#8B949A; --line:#D8DCD7; --line-2:#C7CCC6;
  --claude:#1E7F7A; --claude-soft:#DDF0EE; --codex:#4A57C9; --codex-soft:#E3E6F8;
  --me:#7A4E8E; --noah:#9C6A12; --noah-soft:#F5EAD2;
  --ok:#2E8B4E; --warn:#C27A12; --bad:#C0392B;
  --add:#2E8B4E; --del:#C0392B; --addbg:#E6F4EA; --delbg:#FBE9E7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1214; --surface:#1C2023; --surface-2:#23282B; --surface-3:#2B3134;
    --ink:#E4E7E4; --ink-2:#9AA3A8; --ink-3:#6E787D; --line:#2E3538; --line-2:#3A4245;
    --claude:#45B8B1; --claude-soft:#1B3634; --codex:#8A93F0; --codex-soft:#25294A;
    --me:#C08AD6; --noah:#E0A63A; --noah-soft:#3A2F17;
    --ok:#4FB870; --warn:#E09A2E; --bad:#E0584A;
    --add:#4FB870; --del:#E0584A; --addbg:#173124; --delbg:#3A1F1C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#1C2023; --surface-2:#23282B; --surface-3:#2B3134;
  --ink:#E4E7E4; --ink-2:#9AA3A8; --ink-3:#6E787D; --line:#2E3538; --line-2:#3A4245;
  --claude:#45B8B1; --claude-soft:#1B3634; --codex:#8A93F0; --codex-soft:#25294A;
  --me:#C08AD6; --noah:#E0A63A; --noah-soft:#3A2F17;
  --ok:#4FB870; --warn:#E09A2E; --bad:#E0584A;
  --add:#4FB870; --del:#E0584A; --addbg:#173124; --delbg:#3A1F1C;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
code{font-family:"IBM Plex Mono",monospace;font-size:.9em;background:var(--surface-2);padding:.05em .35em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--claude);outline-offset:-2px}
.sq{width:7px;height:7px;background:var(--line-2);flex:none;display:inline-block}
.sq.work{background:var(--warn);animation:pulse 1.6s infinite}.sq.ok{background:var(--ok)}.sq.idle{background:var(--line-2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{to{visibility:hidden}}
.av{width:20px;height:20px;display:inline-grid;place-items:center;font-size:10px;font-weight:500;color:var(--surface);flex:none;font-family:"IBM Plex Mono",monospace}
.av.me{background:var(--me)}.av.noah{background:var(--noah)}
.av.claude,.av.codex,.av.omp,.av.gemini{background:var(--claude);color:transparent;font-size:0;-webkit-mask:var(--logo-a) center/80% no-repeat;mask:var(--logo-a) center/80% no-repeat}
.av.codex{background:var(--codex);-webkit-mask-image:var(--logo-o);mask-image:var(--logo-o)}
.av.omp{background:var(--ink-2);-webkit-mask:none;mask:none;color:var(--surface);font-size:10px}
.av.gemini{background:var(--ink-2);-webkit-mask:none;mask:none;color:var(--surface);font-size:10px}
.av.plus{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3);font-size:12px}

/* window */
.app{position:fixed;inset:14px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:240px 1fr;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.titlebar{height:42px;display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--surface-2);border-bottom:1px solid var(--line);-webkit-app-region:drag}
.lights{display:flex;gap:7px}.lights i{width:11px;height:11px;border-radius:50%;background:var(--line-2)}
.tb-ws{display:flex;gap:10px;align-items:center;font-size:13px;padding-left:18px}
.tb-ws b{font-weight:600}.tb-ws .mono{font-size:11px;color:var(--ink-3)}
.tb-r{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-right:14px}
.pres{display:flex}.pres .av{margin-left:-5px;box-shadow:0 0 0 2px var(--surface-2)}
.tb-k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);padding:2px 7px}

/* sidebar */
.side{border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;min-height:0;font-size:13px}
.sb-top{display:flex;align-items:center;gap:14px;padding:0 14px;height:42px;border-bottom:1px solid var(--line);flex:none;-webkit-app-region:drag}
.sb-top .sb-brand{flex:1}
.sb-brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:.08em;font-size:13px}
.sb-act{height:36px;padding:0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:500;flex:none;width:100%;text-align:left}
.sb-act:hover{background:var(--surface)}
.sb-scroll{overflow-y:auto;overflow-x:visible;flex:1;min-height:0;padding-bottom:12px;display:block}
.sb-sec{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:14px 14px 6px;display:flex;justify-content:space-between;align-items:center}
.sb-scroll>.sb-sec:first-child{height:46px;padding-top:0;padding-bottom:0;border-bottom:1px solid var(--line);margin-bottom:4px}
.sb-sec button{color:var(--ink-2);font-size:14px;line-height:1;padding:0 2px}
.sb-sec button:hover{color:var(--ink)}
.k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.ws-item{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--ink);font-weight:500;width:100%;text-align:left}
.ws-item:hover{background:var(--surface)}
.ws-item.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--ink-2)}
.ws-item .ic{color:var(--ink-3);font-size:11px}
.ws-item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-item{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 30px;color:var(--ink-3);width:100%;text-align:left}
.th-item:hover{background:var(--surface);color:var(--ink-2)}
.th-item.open{color:var(--ink-2)}.th-item.on{color:var(--ink);background:var(--surface)}
.th-item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-item .here{display:flex;flex:none}
.th-item .here .av{width:14px;height:14px;font-size:7px;margin-left:-3px;box-shadow:0 0 0 1.5px var(--surface-2)}
.th-item.on .here .av{box-shadow:0 0 0 1.5px var(--surface)}
.ag-item{display:grid;grid-template-columns:1fr auto;column-gap:8px;row-gap:3px;align-items:center;padding:6px 14px;color:var(--ink)}
.ag-item:hover{background:var(--surface)}
.ag-name{display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.ag-name:hover .nm{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.ag-item .sub{display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:visible}
.sb-sel{padding:0;font-size:10.5px;color:var(--ink-3);border:0}
.sb-sel:hover{color:var(--ink)}
.sb-sel i{font-size:9px}
.sb-sel .dd{min-width:150px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.eff{display:inline-flex;align-items:flex-end;gap:1.5px;height:10px;padding:0 2px;margin-left:6px;color:var(--ink-3)}
.eff i{display:block;width:3px;background:var(--line-2)}
.eff i:nth-child(1){height:3px}.eff i:nth-child(2){height:5px}.eff i:nth-child(3){height:7px}.eff i:nth-child(4){height:10px}
.eff[data-lv="1"] i:nth-child(-n+1),.eff[data-lv="2"] i:nth-child(-n+2),.eff[data-lv="3"] i:nth-child(-n+3),.eff[data-lv="4"] i:nth-child(-n+4){background:var(--ink-2)}
.eff:hover i{background:var(--line-2)}
.eff:hover[data-lv="1"] i:nth-child(-n+1),.eff:hover[data-lv="2"] i:nth-child(-n+2),.eff:hover[data-lv="3"] i:nth-child(-n+3),.eff:hover[data-lv="4"] i:nth-child(-n+4){background:var(--ink)}
.ag-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item .sq{grid-column:2;justify-self:end}
.ag-item>.sub{grid-column:1/3}
.pp-item{display:grid;grid-template-columns:20px 1fr auto;column-gap:8px;row-gap:1px;align-items:center;padding:6px 14px;color:var(--ink);width:100%;text-align:left}
.pp-item:hover{background:var(--surface)}
.pp-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-item .sq{grid-column:3;justify-self:end}
.pp-item .sub{grid-column:2/4;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sb-foot{position:relative;border-top:1px solid var(--line);flex:none}
.acct{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;text-align:left;color:var(--ink)}
.acct:hover{background:var(--surface)}
.acct .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.acct .k{font-size:14px}
.menu{position:absolute;left:10px;right:10px;bottom:calc(100% + 6px);transition:opacity .14s ease,transform .14s ease;background:var(--surface);border:1px solid var(--line-2);box-shadow:6px 6px 0 var(--surface-3);z-index:6;font-size:13px}
.menu .mh{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.menu .mn{font-weight:600}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:8px 12px;text-align:left;color:var(--ink)}
.menu button:hover{background:var(--surface-2)}
.menu button:last-child{border-top:1px solid var(--line);color:var(--ink-2)}
.menu[hidden]{display:block;opacity:0;transform:translateY(4px);pointer-events:none}

.ws-row{position:relative;display:flex;align-items:center}
.ws-row.top{display:block}
.ws-row.top .newpop{left:10px;right:10px}
.ws-row .ws-item{flex:1}
.ws-plus{position:absolute;right:10px;top:0;bottom:0;padding:0 6px;color:var(--ink-3);opacity:0;font-size:14px}
.ws-row:hover .ws-plus,.ws-row.on .ws-plus{opacity:1}
.ws-row:hover .ws-item .k,.ws-row.on .ws-item .k{visibility:hidden}
.ws-plus:hover{color:var(--ink)}
.newpop{position:absolute;left:14px;right:10px;top:calc(100% + 2px);background:var(--surface);border:1px solid var(--line-2);box-shadow:6px 6px 0 var(--surface-3);z-index:7;transition:opacity .14s ease,transform .14s ease}
.newpop[hidden]{display:block;opacity:0;transform:translateY(-4px);pointer-events:none}
.newpop button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 12px;text-align:left;color:var(--ink);font-size:13px}
.newpop button:hover{background:var(--surface-2)}
.newpop button svg{color:var(--ink-2);flex:none}
.newpop small,.kindpick small{display:block;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.lk{display:inline-flex;color:var(--ink-3);flex:none}
.th-item .lk{margin-left:2px}

.float .sp{flex:1}
.float:empty{display:none}
.chip.lkc{display:inline-flex;align-items:center;gap:5px}
.scope{position:relative;margin-left:auto}
.scopebtn{display:flex;align-items:center;gap:8px;padding:4px 6px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px}
.scopebtn:hover{color:var(--ink);background:var(--surface-2)}
.scopebtn .pres .av{width:18px;height:18px;font-size:8px;margin-left:-4px;box-shadow:0 0 0 1.5px var(--surface)}
.scopebtn .pres .av:first-child{margin-left:0}
.scopebtn .sep{width:1px;height:14px;background:var(--line-2)}
.scopepop{position:absolute;right:0;top:calc(100% + 6px);width:300px;background:var(--surface);border:1px solid var(--line-2);box-shadow:6px 6px 0 var(--surface-3);z-index:8;font-family:"IBM Plex Sans",sans-serif;font-size:13px;text-transform:none;letter-spacing:0;transition:opacity .14s ease,transform .14s ease}
.scopepop[hidden]{display:block;opacity:0;transform:translateY(-4px);pointer-events:none}
.sph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink)}
.sph svg{color:var(--ink-2)}
.sps{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px 4px}
.spo{display:flex;align-items:center;gap:10px;width:100%;padding:6px 12px;text-align:left;color:var(--ink-2)}
.spo.on{color:var(--ink)}
.spo:hover{background:var(--surface-2)}
.spo[disabled]{cursor:default}
.spo .chk{margin-left:auto;color:var(--claude);font-family:"IBM Plex Mono",monospace;width:12px}
.spo.add{color:var(--ink-3)}
.spf{padding:8px 12px 10px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:4px}
.repopick{border:0;padding:0;background:none}
.repopick .chip.addrepo{color:var(--ink-3);border-style:dashed}
.repopick:hover .chip{color:var(--ink);border-color:var(--line-2)}
.repopick .dd{font-family:"IBM Plex Mono",monospace;font-size:11.5px;text-transform:none;letter-spacing:0;min-width:240px}
.dd .ddf{display:block;padding:6px 10px 8px;font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.thead .share{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:11px;color:var(--ink-2);border:1px solid var(--line-2);padding:2px 8px}
.thead .share:hover{color:var(--ink)}
.pinsel{border:0;padding:0;color:var(--ink-3);font-size:11px}
.pinsel:hover{color:var(--ink)}
.pinsel .dd{bottom:calc(100% + 6px);top:auto;left:0}
.kindpick{display:flex;gap:6px}
.kindpick button{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);color:var(--ink-2);flex:1;text-align:left}
.kindpick button svg{flex:none}
.kindpick button.on{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}

/* pane + tabs */
.pane{display:grid;grid-template-rows:42px 36px 1fr;min-width:0;min-height:0}
.tabs-strip{display:flex;align-items:stretch;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12.5px;overflow:visible}
.tab{display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink-2);border-right:1px solid var(--line);white-space:nowrap;flex:none;max-width:220px}
.tab.on{background:var(--surface);color:var(--ink);font-weight:500;position:relative;z-index:1;box-shadow:0 1px 0 0 var(--surface)}
.tab .tn{overflow:hidden;text-overflow:ellipsis}
.tab .tn.untitled,.th-item .nm.untitled{font-style:italic;color:var(--ink-3)}
.tab .tx{color:var(--ink-3);font-size:12px;margin-left:2px;padding:2px 3px}
.tab .tx:hover{color:var(--ink);background:var(--surface-3)}
.tab.new{color:var(--ink-3);font-size:14px}
.strip-sp{flex:1}
.strip-k{align-self:center;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);padding:0 12px;white-space:nowrap}
.pane-body{display:grid;grid-template-columns:1fr;min-width:0;min-height:0}

/* thread */
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.thead{height:46px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);flex:none;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.thead .t.untitled{font-style:italic;color:var(--ink-3);text-transform:none;letter-spacing:0}
.thead .t{text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 7px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.thead .sp{flex:1}
.thead .who{font-size:11.5px;color:var(--ink-3);white-space:nowrap;display:flex;gap:8px;align-items:center}
.thead .who .sq{width:6px;height:6px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px max(18px,calc((100% - 880px)/2)) 8px;display:grid;gap:14px;align-content:start}
.empty{color:var(--ink-3);font-size:13.5px;max-width:52ch;padding:40px 0;display:grid;gap:8px}
.empty b{color:var(--ink-2);font-weight:500}
.msg{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:6px 10px;margin:0 -10px;transition:background .12s ease}
.msg:hover{background:var(--surface-2)}
.msg.cont{margin-top:-14px}.msg.cont .av{visibility:hidden}.msg.cont .hd{display:none}
.msg .av{width:26px;height:26px;font-size:11px}
.msg .hd{display:flex;gap:8px;align-items:baseline}
.msg .nm{font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em;font-size:11.5px;font-weight:600}
.msg .tm{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.msg .tx{color:var(--ink);max-width:76ch;white-space:pre-wrap}
.nm.me{color:var(--me)}.nm.noah{color:var(--noah)}.nm.claude{color:var(--claude)}.nm.codex{color:var(--codex)}.nm.omp,.nm.gemini{color:var(--ink-2)}
.mention{font-weight:600;padding:0 4px}
.mention.claude{background:var(--claude-soft);color:var(--claude)}.mention.codex{background:var(--codex-soft);color:var(--codex)}
.mention.noah{background:var(--noah-soft);color:var(--noah)}.mention.me{background:var(--surface-2);color:var(--me)}
.msg.dispatch .tx,.msg.steer .tx{border-left:3px solid var(--claude);padding-left:10px}
.rcpt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);margin-top:4px;padding-left:13px}
.rcpt i{color:var(--claude);font-style:normal}
.act{border:1px solid var(--line);max-width:680px;margin-top:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface)}
.act .ah{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-2);color:var(--ink-2);cursor:pointer;user-select:none;font-size:11.5px;width:100%;text-align:left}
.act .ah .tog{color:var(--ink-3);width:10px}
.act .ah .st{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:11px}
.act .ah .st i{width:7px;height:7px;background:var(--warn);display:inline-block}
.act .ah .st.work i{animation:pulse 1.6s infinite}.act .ah .st.done i{background:var(--ok)}
.act .stepwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s ease}
.act.closed .stepwrap{grid-template-rows:0fr}
.act .stepwrap>.steps{min-height:0;overflow:hidden}
.steps{border-top:1px solid var(--line);display:grid}
.act.closed .steps{border-top-width:0}
.step{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);align-items:center}
.step:last-child{border-bottom:0}
.step .ic{color:var(--ok);text-align:center}.step .ic.run{color:var(--warn)}
.step .r{color:var(--ink-3);font-size:11px}
.perm{display:flex;gap:6px;margin-top:8px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.perm button{border:1px solid var(--line-2);padding:2px 8px;color:var(--ink-2);background:var(--surface)}
.perm button:hover{color:var(--ink)}
.perm .did{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.card{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:1px solid var(--line);padding:8px 12px;max-width:420px;margin-top:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--line-2);background:var(--surface-2)}
.card.on{border-color:var(--claude)}
.card .ai{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);color:var(--claude);font-size:13px;font-family:"IBM Plex Mono",monospace}
.card .ttl{font-weight:600;font-size:13px}

  var mention=(text.match(/@(claude|codex|omp|gemini)\b/)||[])[1];
  var m={who:'me',t:now(),tx:text};
  if(mention){var ag=agentByHandle(mention)||agentById(mention);if(!ag){toast('No agent called @'+mention+' in this workspace');mention=null}else if(th.agents&&th.agents.indexOf(ag.id)<0){toast(harnesses[ag.h].n+' is not in this chat · add it from the header');mention=null}}
  if(mention&&th.status==='working'&&th.runAgent===mention){m.kind='steer';th.msgs.push(m);renderThread();simulateSteer(th,m,mention);return}
  if(mention&&th.status==='working'){m.kind='dispatch';th.msgs.push(m);renderThread();toast('Queued: one run at a time per chat. '+nameOf(mention)+' will start when the current run lands.');return}

  if(th.private&&th.pin&&th.status!=='working'){m.kind='dispatch';th.msgs.push(m);renderThread();simulateDispatch(th,th.pin,text);return}

 +'<div class="row"><span>Account</span><span class="val">Apekshik Panigrahi <span class="hint">· GitHub apekshik</span></span></div>'
 +'<div class="row"><span>This machine</span><span class="seg"><button class="on" data-act="seg" data-k="runner" data-v="on">runner while Beam is open</button><button data-act="seg" data-k="runner" data-v="off">never a runner</button></span></div>'
 +'<div class="row"><span>Worktrees</span><input type="text" value="~/.beam/&lt;workspace&gt;/&lt;chat&gt;"></div>'
 +'<div class="row"><span>Appearance</span><span class="seg"><button class="on" data-act="seg" data-k="theme" data-v="system">system</button><button data-act="seg" data-k="theme" data-v="light">light</button><button data-act="seg" data-k="theme" data-v="dark">dark</button></span></div>'
 +'<div class="row"><span>Adding people</span><span class="seg"><button class="'+(prefs.addToChat==='auto'?'on':'')+'" data-act="pref" data-k="addToChat" data-v="auto">add to the chat right away</button><button class="'+(prefs.addToChat==='ask'?'on':'')+'" data-act="pref" data-k="addToChat" data-v="ask">ask me first</button></span></div>'
 +'<div class="row"><span>Notifications</span><span class="seg"><button class="on" data-act="seg" data-k="notif" data-v="mine">runs I dispatched</button><button data-act="seg" data-k="notif" data-v="all">all runs</button><button data-act="seg" data-k="notif" data-v="off">off</button></span></div>'
 +'<div class="row"><span>Shortcuts</span><span class="hint">⌘T chat · ⌘W close · ⌘K jump · ⌘⏎ interrupt</span></div>'
 +'<div class="m-f"><span>Per-agent settings live on each agent in the sidebar.</span><span><button class="btn" data-act="closemodal">Done</button></span></div>')}
function harnessModal(){var h='<div class="m-h">Connected harnesses<span class="k hint">your own subscriptions, on this machine</span></div><div class="list">';
 [['claude','Claude Code','signed in · Max plan · v2.4.1'],['codex','Codex','signed in · ChatGPT Pro · v0.9.3'],['omp','omp','installed · providers: openai ✓ kimi ✓ anthropic (api key)'],['gemini','Gemini CLI','not installed']].forEach(function(x){h+='<button data-act="closemodal">'+avHtml(x[0])+'<span class="nm">'+x[1]+'<small>'+x[2]+'</small></span><span class="d">'+(x[2].indexOf('signed')===0?'sign out':'install')+'</span></button>'});
 h+='</div><div class="m-f"><span>Beam never sees your credentials. Each harness keeps its own login.</span></div>';openModal(h)}
function shareModal(id){var th=thread(id);openModal('<div class="m-h">'+ICO.team+' Share this chat</div><div class="row"><span>With</span><span class="seg"><button class="on" data-act="seg" data-k="with" data-v="ws">everyone in '+esc(ws().name)+'</button>'+members.filter(function(m){return m!=='me'}).map(function(m){return '<button data-act="seg" data-k="with" data-v="'+m+'">'+esc(people[m].n)+'</button>'}).join('')+'</span></div><div class="row"><span>History</span><span class="hint">all '+th.msgs.length+' messages become visible from the first one. This cannot be undone.</span></div><div class="row"><span>Default agent</span><span class="hint">'+(th.pin?'unpinned on share · team chats dispatch by @mention only':'none pinned')+'</span></div><div class="m-f"><span>Shared chats never go private again.</span><span><button class="btn ghost" data-act="closemodal">Cancel</button> <button class="btn" data-act="doshare" data-id="'+id+'">Share</button></span></div>')}
function inviteModal(){openModal('<div class="m-h">Invite to '+esc(ws().name)+'</div><div class="row"><span>GitHub login</span><input type="text" id="inv" placeholder="octocat"></div><div class="row"><span>Access</span><span class="hint">follows repo access · they connect their own harnesses</span></div><div class="m-f"><span>Their machine becomes a runner while Beam is open.</span><span><button class="btn ghost" data-act="closemodal">Cancel</button> <button class="btn" data-act="sendinvite">Invite</button></span></div>');document.getElementById('inv').focus()}
function newWsModal(){var h='<div class="m-h">New workspace<span class="k hint">a team space · repos attach to chats</span></div><div class="row"><span>Name</span><input type="text" id="ws-name" placeholder="acme"></div><div class="sb-sec" style="padding:10px 14px 4px">Start with a repo</div><div class="list">';
  [['acme/billing','private · TypeScript','2h ago'],['acme/mobile','private · Swift','yesterday'],['apekshik/anvil','public · Swift','3d ago'],['noahb/dotfiles','public · shell','2w ago']].forEach(function(r){h+='<button data-act="pickrepo" data-id="'+r[0]+'">'+'<span class="k">▢</span><span class="nm">'+r[0]+'<small>'+r[1]+'</small></span><span class="d">'+r[2]+'</span></button>'});
  h+='</div><div class="m-f"><span>You can add more repos any time. People join by invite.</span></div>';openModal(h)}
function palette(){openModal('<input id="pal-q" placeholder="Jump to a chat…"><div class="list" id="pal-list"></div>','pal');var q=document.getElementById('pal-q');q.focus();palRender('');q.addEventListener('input',function(){palRender(q.value)});q.addEventListener('keydown',function(e){if(e.key==='Enter'){var b=document.querySelector('#pal-list button');if(b)b.click()}})}
function palRender(q){q=q.toLowerCase();var h='';workspaces.forEach(function(w){w.threads.forEach(function(t){if(q&&(t.title+' '+w.name).toLowerCase().indexOf(q)<0)return;h+='<button data-act="jump" data-ws="'+w.id+'" data-id="'+t.id+'"><span class="sq '+threadStatus(t)+'"></span><span class="nm">'+esc(t.title)+'<small>'+esc(w.name)+'</small></span><span class="d">'+(t.pr?'#'+t.pr.n:'')+'</span></button>'})});document.getElementById('pal-list').innerHTML=h||'<div class="empty" style="padding:16px 14px">Nothing matches.</div>'}

/* ---------- mention popover ---------- */
function popItems(q){q=(q||'').toLowerCase();var h='',any=false;
  var ag=agents.filter(function(a){return !q||a.handle.indexOf(q)===0||harnesses[a.h].n.toLowerCase().indexOf(q)===0});
  if(ag.length){h+='<div class="ph">Agents</div>';ag.forEach(function(a,i){any=true;h+='<button class="po'+(i===0?' sel':'')+'" data-act="pick" data-v="'+a.handle+'">'+avHtml(a.id)+'<span>'+esc(harnesses[a.h].n)+(a.handle!==a.h?' <span class="k">@'+a.handle+'</span>':'')+'</span><span class="d">'+esc(a.model)+' · '+a.effort+'</span></button>'})}
  var pp=members.filter(function(m){return m!=='me'&&(!q||people[m].n.toLowerCase().indexOf(q)===0)});
  if(pp.length){h+='<div class="ph">People</div>';pp.forEach(function(m){h+='<button class="po'+(!any?' sel':'')+'" data-act="pick" data-v="'+people[m].n.toLowerCase()+'">'+avHtml(m)+'<span>'+esc(people[m].n)+'</span><span class="d">online</span></button>'})}
  return h}
function updatePop(){var inp=document.getElementById('input'),pop=document.getElementById('pop');if(!inp||!pop)return;var v=inp.value.slice(0,inp.selectionStart),m=v.match(/(?:^|\s)@(\w*)$/);if(m){pop.innerHTML=popItems(m[1]);pop.hidden=!pop.innerHTML}else pop.hidden=true}
function pickMention(v){var inp=document.getElementById('input'),pop=document.getElementById('pop');var pos=inp.selectionStart,before=inp.value.slice(0,pos).replace(/@\w*$/,'@'+v+' '),after=inp.value.slice(pos);inp.value=before+after;inp.selectionStart=inp.selectionEnd=before.length;pop.hidden=true;inp.focus()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b){var sel=e.target.closest('.sel');document.querySelectorAll('.sel.open').forEach(function(s){if(s!==sel)s.classList.remove('open')});if(sel)sel.classList.toggle('open');return}
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  switch(act){
    case 'ws':state.ws=id;renderAll();break;
    case 'thread':openThread(id);break;
    case 'tab':openThread(id);break;
    case 'closetab':e.stopPropagation();closeTab(id);break;
    case 'newthread':newThread();break;
    case 'topplus':{e.stopPropagation();var tp=document.getElementById('newpop-top');tp.innerHTML='<button data-act="newchat" data-ws="'+ws().id+'" data-kind="team">'+ICO.team+'<span>Team chat<small>everyone in '+esc(ws().name)+'</small></span></button><button data-act="newchat" data-ws="'+ws().id+'" data-kind="private">'+ICO.lock+'<span>Private chat<small>just you · pin a default agent</small></span></button>';document.querySelectorAll('.newpop').forEach(function(x){if(x!==tp)x.hidden=true});tp.hidden=!tp.hidden;break}
    case 'wsplus':{e.stopPropagation();var np=document.getElementById('newpop-'+id);document.querySelectorAll('.newpop').forEach(function(x){if(x!==np)x.hidden=true});np.hidden=!np.hidden;break}
    case 'newchat':{state.ws=b.getAttribute('data-ws');renderAll();newThread(b.getAttribute('data-kind'));break}
    case 'pin':{var pt=cur();pt.pin=b.getAttribute('data-v')||null;renderThread();toast(pt.pin?harnesses[agentById(pt.pin).h].n+' pinned · plain messages go to it':'Unpinned · @mention to dispatch');break}
    case 'scope':{e.stopPropagation();var sp=document.getElementById('scopepop');sp.hidden=!sp.hidden;break}
    case 'scope-person':{e.stopPropagation();var tp=cur();if(tp.private){shareModal(tp.id);break}tp.members=tp.members||members.slice();var ix=tp.members.indexOf(id);if(ix>=0){if(tp.members.length<=1){toast('A chat needs at least one member');break}tp.members.splice(ix,1);toast(people[id].n+' removed from this chat')}else{tp.members.push(id);toast(people[id].n+' added · they see the whole history')}renderThread();document.getElementById('scopepop').hidden=false;break}
    case 'scope-agent':{e.stopPropagation();var ta=cur();ta.agents=ta.agents||agents.map(function(a){return a.id});var ai=ta.agents.indexOf(id);if(ai>=0)ta.agents.splice(ai,1);else ta.agents.push(id);renderThread();document.getElementById('scopepop').hidden=false;break}
    case 'share':shareModal(id);break;
    case 'doshare':{var sh=thread(id);sh.private=false;sh.pin=null;sh.members=members.slice();closeModal();renderAll();toast('Shared · everyone can see it now');break}
    case 'newws':newWsModal();break;
    case 'pickrepo':{var wn=((document.getElementById('ws-name')||{}).value||'').trim()||id.split('/')[0];var wid='w'+Date.now();workspaces.push({id:wid,name:wn,repos:[id],threads:[]});state.tabs[wid]=[];state.active[wid]=null;state.ws=wid;closeModal();renderAll();toast('Workspace '+wn+' created with '+id);break}
    case 'agent':agentSettings(id);break;
    case 'sbmodel':{var sa=agentById(id);sa.model=b.getAttribute('data-v');renderSidebar();toast(harnesses[sa.h].n+' → '+sa.model+' · next run');break}
    case 'cycleeff':{var ca=agentById(id),ord=['low','medium','high','max'];ca.effort=ord[(ord.indexOf(ca.effort)+1)%ord.length];b.setAttribute('data-lv',ord.indexOf(ca.effort)+1);b.title='Reasoning effort: '+ca.effort+' · click to change';toast(harnesses[ca.h].n+' effort → '+ca.effort);break}
    case 'agtab':agentSettings(id);break;
    case 'addagent':addAgentModal();break;
    case 'pickharness':addAgent(id);break;
    case 'pickmodel':modalDraft.model=b.getAttribute('data-v');document.getElementById('ag-model-v').textContent=modalDraft.model;b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});b.closest('.sel').classList.remove('open');e.stopPropagation();break;
    case 'pref':prefs[b.getAttribute('data-k')]=b.getAttribute('data-v');b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});break;
    case 'seg':modalDraft[b.getAttribute('data-k')]=b.getAttribute('data-v');b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});break;
    case 'saveagent':{var a=agentById(id);a.model=modalDraft.model||a.model;a.effort=modalDraft.effort||a.effort;a.perm=modalDraft.perm||a.perm;a.ctx=modalDraft.ctx||a.ctx;var hv=document.getElementById('ag-handle').value.replace(/^@/,'').trim();if(hv)a.handle=hv;a.allow=document.getElementById('ag-allow').value;closeModal();renderAll();toast('Saved · applies to the next run');break}
    case 'removeagent':{if(agents.length<=1){toast('Keep at least one agent');break}agents=agents.filter(function(x){return x.id!==id});closeModal();renderAll();toast('Agent removed from workspace');break}
    case 'invite':closeAcct();inviteModal();break;
    case 'acct':{var mn=document.getElementById('acctmenu');mn.hidden=!mn.hidden;b.setAttribute('aria-expanded',!mn.hidden);break}
    case 'menu-settings':closeAcct();settingsModal();break;
    case 'menu-usage':closeAcct();toast('Usage: Claude 62% of plan · Codex 18% · resets in 9 days');break;
    case 'menu-harness':closeAcct();harnessModal();break;
    case 'menu-logout':closeAcct();toast('Logged out (prototype)');break;
    case 'sendinvite':{var v=(document.getElementById('inv').value||'').trim();if(!v){toast('Need a GitHub login');break}var ci=cur();if(ci&&!ci.private&&prefs.addToChat==='auto'){ci.members=ci.members||members.slice();toast('Invited '+v+' · added to this chat too')}else toast('Invited '+v+' · they appear when they sign in');closeModal();renderThread();break}
    case 'person':toast(people[id].n+' · runner while Beam is open · '+people[id].host);break;
    case 'closemodal':closeModal();break;
    case 'togact':{var box=b.parentNode,th=cur(),m=th.msgs[+box.getAttribute('data-idx')];m.act.open=!m.act.open;box.classList.toggle('closed',!m.act.open);b.querySelector('.tog').textContent=m.act.open?'▾':'▸';break}
    case 'setrepo':{var tr=cur();if(tr.branch&&tr.repo!==b.getAttribute('data-v')){toast('This chat already has a branch on '+tr.repo);break}tr.repo=b.getAttribute('data-v');renderThread();toast(tr.repo+' attached · worktree on first dispatch');break}
    case 'addrepo':closeModal();openModal('<div class="m-h">Connect a repo to '+esc(ws().name)+'</div><div class="list">'+[['acme/mobile','private · Swift'],['apekshik/anvil','public · Swift'],['noahb/dotfiles','public · shell']].map(function(r){return '<button data-act="connectrepo" data-id="'+r[0]+'"><span class="k">▢</span><span class="nm">'+r[0]+'<small>'+r[1]+'</small></span><span class="d">clone</span></button>'}).join('')+'</div><div class="m-f"><span>Cloned once per runner, then worktrees per chat.</span></div>');break;
    case 'connectrepo':{ws().repos.push(id);var tc=cur();if(tc&&!tc.repo)tc.repo=id;closeModal();renderAll();toast(id+' connected');break}
    case 'togart':togArt(id);break;
    case 'react':react(+b.getAttribute('data-i'),b.getAttribute('data-e'));break;
    case 'reactmore':{var ri=+b.getAttribute('data-i'),pk=b.parentNode;pk.innerHTML=['👍','🔥','👀','✅','💯','🚀','🤔','😂','🙏','👎'].map(function(e){return '<button data-act="react" data-i="'+ri+'" data-e="'+e+'">'+e+'</button>'}).join('');pk.classList.add('open');break}
    case 'atbtn':{var inp2=document.getElementById('input');inp2.value+=(inp2.value&&!/\s$/.test(inp2.value)?' ':'')+'@';inp2.focus();inp2.selectionStart=inp2.selectionEnd=inp2.value.length;updatePop();break}
    case 'pick':pickMention(b.getAttribute('data-v'));break;
    case 'allow':{var mm=cur().msgs[+b.getAttribute('data-i')];mm.perm={by:'Apekshik',t:now()};renderThread();break}
    case 'deny':toast('Denied · the agent will pick another route or ask again');break;
    case 'jump':{state.ws=b.getAttribute('data-ws');closeModal();openThread(id);break}
    case 'palbtn':case 'sbsearch':palette();break;
  }
});
document.getElementById('palbtn').setAttribute('data-act','palbtn');
document.getElementById('sbsearch').setAttribute('data-act','sbsearch');
document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('click',function(e){if(!e.target.closest('.scope')){var spx=document.getElementById('scopepop');if(spx)spx.hidden=true}if(!e.target.closest('.sb-foot'))closeAcct();if(!e.target.closest('.ws-row'))document.querySelectorAll('.newpop').forEach(function(x){x.hidden=true})});
document.addEventListener('input',function(e){if(e.target.id==='input'){e.target.style.height='auto';e.target.style.height=Math.min(160,e.target.scrollHeight)+'px';updatePop()}});
document.addEventListener('keydown',function(e){
  var inp=document.getElementById('input'),pop=document.getElementById('pop');
  if(e.key==='Escape'){closeModal();closeAcct();var spe=document.getElementById('scopepop');if(spe)spe.hidden=true;if(pop)pop.hidden=true;return}
  if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();settingsModal();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();palette();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='t'){e.preventDefault();newThread(e.shiftKey?'private':undefined);return}
  if((e.metaKey||e.ctrlKey)&&e.key==='w'){e.preventDefault();var w=ws();if(state.active[w.id])closeTab(state.active[w.id]);return}
  if(e.target===inp){
    if(pop&&!pop.hidden&&(e.key==='Enter'||e.key==='Tab')){e.preventDefault();var s=pop.querySelector('.po.sel')||pop.querySelector('.po');if(s)pickMention(s.getAttribute('data-v'));return}
    if(pop&&!pop.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();var items=Array.prototype.slice.call(pop.querySelectorAll('.po')),i=items.findIndex(function(x){return x.classList.contains('sel')});items.forEach(function(x){x.classList.remove('sel')});items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].classList.add('sel');return}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if((e.metaKey||e.ctrlKey)&&cur().status==='working'){toast('Interrupt: current tool call cancelled, your message delivered now');}var v=inp.value;inp.value='';inp.style.height='auto';post(v);return}
  }
  if(e.target.classList&&e.target.classList.contains('tab')&&e.key==='Enter'){openThread(e.target.getAttribute('data-id'))}
});
document.addEventListener('click',function(e){var th=e.target.closest('th[data-i]');if(!th)return;var box=th.closest('.artbox');if(!box)return;var a=art(cur(),box.getAttribute('data-aid'));if(!a||!a.table)return;var i=+th.getAttribute('data-i');if(a.sort===i)a.desc=!a.desc;else{a.sort=i;a.desc=i===2}box.innerHTML=artBody(a)});
document.addEventListener('keyup',function(e){if(e.target.id==='input'&&['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>=0)updatePop()});

/* live timer on the auth thread */
(function(){var t0=Date.now()-252000;setInterval(function(){var el=document.querySelector('.act .st.work .rt');if(!el)return;var th=cur();if(!th||th.id!=='auth')return;var s=Math.round((Date.now()-t0)/1000);el.textContent=Math.floor(s/60)+'m '+(s%60<10?'0':'')+(s%60)+'s'},1000)})();

renderAll();
})();
</script>
