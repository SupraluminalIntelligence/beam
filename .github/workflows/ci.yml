name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_removals:
        description: Deploy Convex even if it removes functions the deployment still serves
        type: boolean
        default: false

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main queue so a deploy
# is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # convex/_generated is gitignored and normally written by `convex dev`
      # against a deployment. --system-udfs writes the same bindings offline,
      # so CI needs no Convex project or secrets.
      - name: Generate Convex bindings
        run: pnpm exec convex codegen --system-udfs --typecheck disable

      - run: pnpm typecheck

      - name: Typecheck convex/
        run: pnpm exec tsc -p convex --noEmit

      - run: pnpm test

      - run: pnpm --filter @beam/web build

      # tsc accepts code Metro cannot bundle, such as a node: import in a
      # package the phone shares. Bundle the phone's JavaScript as EAS would.
      - name: Bundle the phone app
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/mobile"

  # Shows on a pull request into main whether the deploy after merging would
  # be refused. Fork pull requests get no secrets, so they skip it.
  convex-removals:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Convex bindings
        run: pnpm exec convex codegen --system-udfs --typecheck disable

      - name: Compare with production
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::notice::No CONVEX_DEPLOY_KEY for this pull request; skipping."
            exit 0
          fi
          pnpm convex:removals

  # Production Convex follows main. Installed phone and desktop builds call it,
  # so a deploy that would remove a function they may use is refused.
  deploy-convex:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: convex
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require a deploy key
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Add a production deploy key from the Convex dashboard as the CONVEX_DEPLOY_KEY secret."
            exit 1
          fi

      - name: Generate Convex bindings
        run: pnpm exec convex codegen --system-udfs --typecheck disable

      - name: Refuse to remove deployed functions
        env:
          BEAM_ALLOW_CONVEX_REMOVALS: ${{ inputs.allow_removals && '1' || '' }}
        run: pnpm convex:removals

      - run: pnpm convex:deploy
